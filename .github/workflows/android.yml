name: Byg minimal test-app v3.0.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fast debug-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: min-vaegt-test-v301-keystore

      - name: Rens og byg
        run: gradle clean :app:assembleDebug

      - name: Find Android build-tools
        id: bt
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Test APK container
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Verificer APK signatur
        run: '"${{ steps.bt.outputs.dir }}/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'

      - name: Dump APK metadata
        run: '"${{ steps.bt.outputs.dir }}/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt'

      - name: Krydstjek metadata
        shell: bash
        run: |
          grep -F "package: name='dk.hjlab.minvaegttest301'" apk-badging.txt
          grep -F "versionCode='301'" apk-badging.txt
          grep -F "versionName='3.0.1'" apk-badging.txt
          grep -F "sdkVersion:'26'" apk-badging.txt
          grep -F "targetSdkVersion:'35'" apk-badging.txt
          grep -F "launchable-activity: name='dk.hjlab.minvaegt.MainActivity'" apk-badging.txt

      - name: Lav release filer
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Min-Vaegt-TEST-v3.0.1.apk
          sha256sum Min-Vaegt-TEST-v3.0.1.apk > SHA256SUMS-v3.0.1.txt
          test -s Min-Vaegt-TEST-v3.0.1.apk
          test -s SHA256SUMS-v3.0.1.txt

      - name: Gem artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Min-Vaegt-TEST-v3.0.1
          path: |
            Min-Vaegt-TEST-v3.0.1.apk
            SHA256SUMS-v3.0.1.txt
            apk-badging.txt
          if-no-files-found: error

      - name: Opret release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view test-v3.0.1 >/dev/null 2>&1; then
            gh release upload test-v3.0.1 Min-Vaegt-TEST-v3.0.1.apk SHA256SUMS-v3.0.1.txt --clobber
          else
            gh release create test-v3.0.1 Min-Vaegt-TEST-v3.0.1.apk SHA256SUMS-v3.0.1.txt --title "Min Vægt TEST v3.0.1" --notes "Minimal testapp med krydstjek af struktur, signatur, pakke-id, launcher, SDK og versionsnummer."
          fi
