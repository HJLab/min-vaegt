name: Byg minimal test-app v3.0.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Genbrug samme Android debug-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: min-vaegt-test-v3-keystore

      - name: Rens og byg minimal APK
        run: gradle clean :app:assembleDebug

      - name: Find Android build-tools
        id: bt
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "dir=$BT" >> "$GITHUB_OUTPUT"

      - name: Verificer APK som ZIP
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Verificer Android-signatur
        run: '"${{ steps.bt.outputs.dir }}/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'

      - name: Laes APK-identitet
        run: '"${{ steps.bt.outputs.dir }}/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt'

      - name: Krydstjek pakke, version og minSdk
        shell: bash
        run: |
          grep -q "package: name='dk.hjlab.minvaegttest'" apk-badging.txt
          grep -q "versionCode='300'" apk-badging.txt
          grep -q "versionName='3.0.0'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt

      - name: Omdob APK og lav checksum
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Min-Vaegt-TEST-v3.0.0.apk
          sha256sum Min-Vaegt-TEST-v3.0.0.apk > SHA256SUMS-v3.0.0.txt
          ls -lh Min-Vaegt-TEST-v3.0.0.apk SHA256SUMS-v3.0.0.txt

      - name: Gem verificeret test-APK
        uses: actions/upload-artifact@v4
        with:
          name: Min-Vaegt-TEST-v3.0.0
          path: |
            Min-Vaegt-TEST-v3.0.0.apk
            SHA256SUMS-v3.0.0.txt
            apk-badging.txt
          if-no-files-found: error

      - name: Opret GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view test-v3.0.0 >/dev/null 2>&1; then
            gh release upload test-v3.0.0 Min-Vaegt-TEST-v3.0.0.apk SHA256SUMS-v3.0.0.txt --clobber
          else
            gh release create test-v3.0.0 Min-Vaegt-TEST-v3.0.0.apk SHA256SUMS-v3.0.0.txt               --title "Min Vægt TEST v3.0.0"               --notes "Helt minimal test-app uden vægtdata eller andre funktioner. Kun lavet for at bevise at APK-installation virker. APK er verificeret for ZIP-struktur, Android-signatur, package-id, version og minSdk før release."
          fi
